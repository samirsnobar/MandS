<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <title>M&S — قائمة الكافيه التفاعلية</title>

      name="description"
      content="قائمة كافيه M&S التفاعلية بأسلوب Bento Grid مع سلة طلب مباشرة عبر واتساب."
    />
    <meta property="og:title" content="M&S — قائمة الكافيه التفاعلية" />
    <meta
      property="og:description"
      content="قائمة كافيه M&S التفاعلية بأسلوب Bento Grid مع سلة طلب مباشرة عبر واتساب."
    />
    <meta property="og:type" content="website" />

      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
    <style>
:root {
  --bg-canvas: #161210;
  --bg-surface: #211b18;
  --bg-subtle: #2c2420;
  --topbar-bg: rgba(22, 18, 16, 0.9);
  --mobile-bar-bg: rgba(33, 27, 24, 0.95);
  --glass-surface: rgba(33, 27, 24, 0.86);
  --in-cart-bg: linear-gradient(145deg, rgba(42, 133, 107, 0.14), rgba(33, 27, 24, 0.98));
  --featured-card-bg: linear-gradient(155deg, rgba(229, 164, 92, 0.1), rgba(33, 27, 24, 0.98));
  --glass-green: rgba(42, 133, 107, 0.16);
  --glass-green-border: rgba(229, 164, 92, 0.28);
  --accent: #2a856b;
  --accent-hover: #216b56;
  --accent-ink: #ffffff;
  --price-accent: #e5a45c;
  --cart-btn-bg: #e5a45c;
  --cart-btn-ink: #1e1612;
  --minus-bg: #3c312b;
  --minus-ink: #f6efe6;
  --ink-primary: #f6efe6;
  --ink-secondary: #cbbcae;
  --ink-muted: #9e8d7f;
  --border-hairline: #382e28;
  --border-strong: #52443b;
  --card-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
  --dot-shadow: 0 2px 10px rgba(229, 164, 92, 0.55);
  --danger: #fca5a5;
  --danger-bg: rgba(153, 27, 27, 0.24);
  --danger-border: rgba(248, 113, 113, 0.38);
  --footer-bg: linear-gradient(180deg, #1b1613 0%, #120e0c 100%);
  --footer-border: rgba(229, 164, 92, 0.22);
  --wordmark-bg: radial-gradient(circle at 50% 0%, rgba(229, 164, 92, 0.14), rgba(33, 27, 24, 0.85));
  --wordmark-border: rgba(229, 164, 92, 0.32);
  --location-chip-bg: rgba(42, 133, 107, 0.14);
  --location-chip-hover: rgba(42, 133, 107, 0.28);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --font-sans: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  --font-serif: "Amiri", Georgia, serif;
  --font-mono: "IBM Plex Mono", monospace;
}

html[data-theme="light"] {
  --bg-canvas: #faf6f0;
  --bg-surface: #ffffff;
  --bg-subtle: #f2eae0;
  --topbar-bg: rgba(250, 246, 240, 0.92);
  --mobile-bar-bg: rgba(255, 255, 255, 0.96);
  --glass-surface: rgba(255, 255, 255, 0.88);
  --in-cart-bg: linear-gradient(145deg, rgba(35, 116, 93, 0.08), #ffffff);
  --featured-card-bg: linear-gradient(155deg, rgba(181, 106, 30, 0.08), #ffffff);
  --glass-green: rgba(35, 116, 93, 0.12);
  --glass-green-border: rgba(181, 106, 30, 0.3);
  --accent: #23745d;
  --accent-hover: #1b5d4a;
  --accent-ink: #ffffff;
  --price-accent: #b56a1e;
  --cart-btn-bg: #1f1814;
  --cart-btn-ink: #faf6f0;
  --minus-bg: #ede4d8;
  --minus-ink: #2b211b;
  --ink-primary: #1f1814;
  --ink-secondary: #5c4d43;
  --ink-muted: #7a695d;
  --border-hairline: #e7ddd0;
  --border-strong: #d3c4b2;
  --card-shadow: 0 12px 26px rgba(45, 31, 20, 0.09);
  --dot-shadow: 0 2px 10px rgba(35, 116, 93, 0.45);
  --danger: #b91c1c;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --danger-border: rgba(220, 38, 38, 0.28);
  --footer-bg: linear-gradient(180deg, #f3ece2 0%, #eae0d2 100%);
  --footer-border: rgba(181, 106, 30, 0.22);
  --wordmark-bg: radial-gradient(circle at 50% 0%, rgba(181, 106, 30, 0.12), rgba(255, 255, 255, 0.94));
  --wordmark-border: rgba(181, 106, 30, 0.35);
  --location-chip-bg: rgba(35, 116, 93, 0.1);
  --location-chip-hover: rgba(35, 116, 93, 0.2);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-family: var(--font-sans);
  scroll-behavior: smooth;
  background-color: var(--bg-canvas);
  color: var(--ink-primary);
}

body {
  margin: 0;
  background-color: var(--bg-canvas);
  color: var(--ink-primary);
  line-height: 1.65;
  overflow-x: hidden;
  transition: background-color 260ms ease, color 260ms ease;
}

img {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

.is-hidden {
  display: none !important;
}

.tabular {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.container {
  width: 100%;
  max-width: 1280px;
  margin-inline: auto;
  padding-inline: 16px;
}

@media (min-width: 640px) {
  .container {
    padding-inline: 32px;
  }
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--topbar-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-hairline);
}

.topbar-inner {
  min-height: 66px;
  padding-block: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

@media (min-width: 768px) {
  .topbar-inner {
    min-height: 74px;
    padding-block: 12px;
  }
}

.brand-showcase {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.brand-showcase-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(229, 164, 92, 0.55), transparent);
}

.brand-wordmark {
  font-family: var(--font-serif);
  font-size: clamp(1.55rem, 2.8vw, 2.1rem);
  font-weight: 700;
  letter-spacing: 0.1em;
  unicode-bidi: isolate;
  color: var(--price-accent);
  text-decoration: none;
  padding: 4px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--wordmark-border);
  background: var(--wordmark-bg);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  white-space: nowrap;
  flex-shrink: 0;
}

.brand-wordmark-compact {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  unicode-bidi: isolate;
  color: var(--price-accent);
  text-decoration: none;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--wordmark-border);
  background: var(--wordmark-bg);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  white-space: nowrap;
  flex-shrink: 0;
}

.topbar-center-emblem {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--price-accent);
  opacity: 0.95;
  animation: floatCoffee 3s ease-in-out infinite;
}

@keyframes floatCoffee {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

.cart-trigger-btn {
  min-height: 42px;
  padding: 8px 16px;
  background: var(--cart-btn-bg);
  color: var(--cart-btn-ink);
  border: 0;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
  transition: background-color 160ms ease, color 160ms ease, transform 180ms ease;
}

.cart-trigger-btn:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.cart-trigger-btn.is-bumping {
  animation: cartBump 320ms cubic-bezier(0.22, 1, 0.36, 1);
}

.btn-primary {
  min-height: 44px;
  padding: 10px 22px;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  cursor: pointer;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary {
  min-height: 44px;
  padding: 10px 18px;
  background: var(--glass-surface);
  color: var(--ink-primary);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 500;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  cursor: pointer;
}

.btn-secondary:hover {
  border-color: var(--ink-primary);
  background: var(--bg-subtle);
}

.search-bar-wrap {
  position: relative;
  width: 100%;
  max-width: 100%;
}

@media (min-width: 768px) {
  .search-bar-wrap {
    max-width: 420px;
  }
}

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  min-height: 48px;
  padding: 10px 42px 10px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--ink-primary);
  font-size: 0.95rem;
  font-weight: 500;
  outline: none;
}

.search-input:focus {
  border-color: var(--price-accent);
  box-shadow: 0 0 0 3px rgba(229, 164, 92, 0.22);
}

.menu-section {
  padding-block: 20px 56px;
}

.section-toolbar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

@media (min-width: 768px) {
  .section-toolbar {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
}

.theme-toggle-btn {
  min-height: 44px;
  padding: 8px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--ink-primary);
  font-size: 0.84rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
}

.theme-icon {
  color: var(--price-accent);
  flex-shrink: 0;
}

.theme-icon--moon {
  display: none;
}

html[data-theme="light"] .theme-icon--sun {
  display: none;
}

html[data-theme="light"] .theme-icon--moon {
  display: block;
}

.category-tabs {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 8px;
  padding: 8px 16px;
  max-width: 1280px;
  margin-inline: auto;
}

.category-tabs::-webkit-scrollbar {
  display: none;
}

@media (min-width: 640px) {
  .category-tabs {
    padding-inline: 32px;
  }
}

@media (min-width: 768px) {
  .category-tabs {
    flex-wrap: wrap;
    overflow-x: visible;
  }
}

.category-tab {
  min-height: 44px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hairline);
  background: var(--glass-surface);
  color: var(--ink-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
}

.category-tab.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.bento-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media (min-width: 640px) {
  .bento-grid {
    gap: 18px;
  }
}

.bento-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-md);
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
  animation: bentoCardReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
  animation-delay: calc(var(--stagger, 0) * 45ms);
}

.bento-card:hover {
  transform: translateY(-2px);
  border-color: var(--glass-green-border);
  box-shadow: var(--card-shadow);
}

.bento-card.is-in-cart {
  border-color: var(--accent);
  background: var(--in-cart-bg);
}

.bento-card--featured {
  background: var(--featured-card-bg);
  border-color: var(--glass-green-border);
}

.bento-media {
  position: relative;
  background: var(--bg-subtle);
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
  border: 0;
  padding: 0;
}

.bento-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 360ms ease;
}

.bento-card:hover .bento-media img {
  transform: scale(1.05);
}

@media (min-width: 640px) {
  .bento-card {
    padding: 0;
    gap: 0;
  }
}

.bento-media-fallback {
  width: 100%;
  height: 100%;
  min-height: 98px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-muted);
  background: var(--bg-subtle);
}

.bento-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  flex: 1;
}

@media (min-width: 640px) {
  .bento-body {
    padding: 16px 18px;
    gap: 12px;
  }
}

.bento-head-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.bento-meta {
  margin: 0;
  font-size: 0.74rem;
  color: var(--ink-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn-story-link {
  background: transparent;
  border: 0;
  padding: 2px 0;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
}

.bento-title-btn {
  background: transparent;
  border: 0;
  padding: 0;
  margin: 2px 0 0;
  text-align: start;
  cursor: pointer;
  color: inherit;
  width: 100%;
}

.bento-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.bento-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink-primary);
  line-height: 1.35;
}

.bento-desc {
  margin: 3px 0 0;
  font-size: 0.84rem;
  color: var(--ink-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.bento-card-footer {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid var(--border-hairline);
}

.bento-price {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--price-accent);
}

.card-stepper {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-canvas);
  border: 1px solid var(--border-hairline);
  border-radius: 10px;
  padding: 2px;
}

.card-stepper--block {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 3px;
}

.card-stepper--block .card-stepper-btn {
  flex: 1;
  min-height: 40px;
}

.card-stepper--block .card-stepper-count {
  flex: 1;
  text-align: center;
}

.card-stepper-btn {
  min-width: 34px;
  min-height: 34px;
  border: 0;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.card-stepper-btn--plus {
  background: var(--accent);
  color: var(--accent-ink);
}

.card-stepper-btn--minus {
  background: var(--minus-bg);
  color: var(--minus-ink);
}

.card-stepper-btn--minus:disabled,
.card-stepper-btn--plus:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.card-stepper-count {
  min-width: 24px;
  text-align: center;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink-primary);
}

.card-stepper-count.is-popping {
  animation: qtyPop 260ms cubic-bezier(0.22, 1, 0.36, 1);
}

.bento-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 6px;
}

.bento-card.is-unavailable {
  opacity: 0.62;
}

.floating-add-dot {
  position: fixed;
  width: 12px;
  height: 12px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: var(--dot-shadow);
  pointer-events: none;
  z-index: 90;
  transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1), opacity 420ms ease;
}

@keyframes bentoCardReveal {
  from { opacity: 0; transform: translateY(10px) scale(0.988); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes qtyPop {
  0% { transform: scale(0.82); }
  55% { transform: scale(1.24); }
  100% { transform: scale(1); }
}

@keyframes cartBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.06); }
  100% { transform: scale(1); }
}

@keyframes cartIconPulse {
  0% { transform: scale(1) rotate(0deg); }
  30% { transform: scale(1.26) rotate(-7deg); }
  65% { transform: scale(0.95) rotate(3deg); }
  100% { transform: scale(1) rotate(0deg); }
}

@keyframes cartPulseRing {
  0% { opacity: 0.72; transform: scale(0.65); }
  100% { opacity: 0; transform: scale(1.95); }
}

.site-footer {
  padding-block: 36px 92px;
  border-top: 1px solid var(--footer-border);
  background: var(--footer-bg);
}

@media (min-width: 768px) {
  .site-footer {
    padding-block: 36px 40px;
  }
}

.footer-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  text-align: center;
}

.footer-brand-showcase {
  max-width: 420px;
}

.footer-brand-wordmark {
  font-size: clamp(1.8rem, 3vw, 2.3rem);
  padding: 6px 20px;
}

.footer-details {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px 28px;
}

.footer-info-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.92rem;
  color: var(--ink-secondary);
}

.footer-info-icon {
  color: var(--price-accent);
  flex-shrink: 0;
}

.footer-info-label {
  color: var(--ink-muted);
  font-weight: 500;
}

.footer-info-link {
  color: var(--ink-primary);
  font-weight: 600;
  text-decoration: none;
}

.footer-location-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--location-chip-bg);
  border: 1px solid rgba(42, 133, 107, 0.32);
  color: var(--ink-primary);
}

.footer-social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.footer-social-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--ink-primary);
  display: inline-flex;
  align-items: center;

function formatSyp(amount) {
  const numeric = Number(amount) || 0;
  return `${numeric.toLocaleString("en-US")} ل.س`;
}

function normalizeWhatsAppNumber(raw) {
  const digits = String(raw || "").replace(/\D/g, "");
  if (!digits) return "963940242745";
  if (digits.startsWith("09") && digits.length === 10) return `963${digits.slice(1)}`;
  if (digits.startsWith("00")) return digits.slice(2);
  return digits;
}

function filterVisibleCategories(categories) {
  return [...categories].filter((cat) => cat.visible !== false).sort((a, b) => (a.order || 0) - (b.order || 0));
}

function filterMenuItems(items, activeCategoryId, visibleCategoryIds, searchQuery = "") {
  const allowedCats = new Set(visibleCategoryIds);
  const q = String(searchQuery || "").trim().toLowerCase();
  return [...items]
    .filter((item) => allowedCats.has(item.categoryId))
    .filter((item) => activeCategoryId === "all" || item.categoryId === activeCategoryId)
    .filter((item) => {
      if (!q) return true;
      const name = String(item.name || "").toLowerCase();
      const desc = String(item.shortDesc || "").toLowerCase();
      return name.includes(q) || desc.includes(q);
    })
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

function addToCart(cartList, incoming) {
  const existingIndex = cartList.findIndex((entry) => entry.key === incoming.key);
  if (existingIndex === -1) return [...cartList, { ...incoming, quantity: 1 }];
  return cartList.map((entry, idx) => (idx === existingIndex ? { ...entry, quantity: entry.quantity + 1 } : entry));
}

function updateCartQuantity(cartList, key, delta) {
  return cartList
    .map((entry) => (entry.key === key ? { ...entry, quantity: entry.quantity + delta } : entry))
    .filter((entry) => entry.quantity > 0);
}

function getItemCartQuantity(cartList, itemId) {
  return cartList.reduce((sum, entry) => (entry.id === itemId ? sum + entry.quantity : sum), 0);
}

function decrementItemFromCart(cartList, itemId, preferredKey) {
  const hasPreferred = preferredKey && cartList.some((entry) => entry.key === preferredKey);
  if (hasPreferred) return updateCartQuantity(cartList, preferredKey, -1);
  const reverseIdx = [...cartList].reverse().findIndex((entry) => entry.id === itemId);
  if (reverseIdx === -1) return cartList;
  const targetIndex = cartList.length - 1 - reverseIdx;
  return updateCartQuantity(cartList, cartList[targetIndex].key, -1);
}

function calculateCartTotals(cartList) {
  const totalCount = cartList.reduce((sum, entry) => sum + entry.quantity, 0);
  const totalAmount = cartList.reduce((sum, entry) => sum + Number(entry.unitPrice || 0) * entry.quantity, 0);
  return { totalCount, totalAmount };
}

function buildWhatsAppOrderText({ cafeName, cart: cartList, customerName, tableOrAddress, note }) {
  const { totalAmount } = calculateCartTotals(cartList);
  const lines = [`مرحباً ${cafeName || "M&S"}، أود إرسال طلب جديد:`, ""];
  cartList.forEach((item, index) => {
    const lineTotal = Number(item.unitPrice || 0) * item.quantity;
    const optionText = item.optionLabel ? ` (${item.optionLabel})` : "";
    lines.push(`${index + 1}. ${item.name}${optionText} × ${item.quantity} = ${formatSyp(lineTotal)}`);
  });
  lines.push("");
  lines.push(`الإجمالي: ${formatSyp(totalAmount)}`);
  if (customerName && customerName.trim()) lines.push(`الاسم: ${customerName.trim()}`);
  if (tableOrAddress && tableOrAddress.trim()) lines.push(`الطاولة / العنوان: ${tableOrAddress.trim()}`);
  if (note && note.trim()) lines.push(`ملاحظات: ${note.trim()}`);
  return lines.join("\n");
}

}

  let catsReceived = false;
  let itemsReceived = false;

  const emitIfReady = () => {

        items: items.sort((a, b) => (a.order || 0) - (b.order || 0))
      };
      LocalMenuAdapter.saveState(nextState);
      onData(nextState);
    }
  };

  const unsubCats = onSnapshot(
    collection(db, "categories"),
    (snapshot) => {
      if (!snapshot.empty || catsReceived) {
        categories = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      }
      catsReceived = true;
      emitIfReady();
    },
    (err) => { if (onError) onError(err); }
  );

  const unsubItems = onSnapshot(
    collection(db, "items"),
    (snapshot) => {
      if (!snapshot.empty || itemsReceived) {
        items = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      }
      itemsReceived = true;
      emitIfReady();
    },
    (err) => { if (onError) onError(err); }
  );

  const unsubSettings = onSnapshot(
    doc(db, "settings", "general"),
    (snapshot) => {
      if (snapshot.exists()) {
        settings = { ...DEFAULT_CAFE_STATE.settings, ...snapshot.data() };
        emitIfReady();
      }
    },
    (err) => console.warn("Settings listener:", err)
  );

  return () => {
    unsubCats();
    unsubItems();
    unsubSettings();
  };
}

    btn.classList.add("is-bumping");

function spawnAddParticle(sourceEl) {
  triggerCartBump();
  if (!sourceEl || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mobileTarget = $("mobile-open-cart-btn");
  const desktopTarget = $("desktop-cart-btn");
  const targetBtn = mobileTarget && mobileTarget.offsetParent !== null ? mobileTarget : desktopTarget;
  if (!targetBtn) return;
  const targetEl = targetBtn.querySelector(".cart-icon-wrap") || targetBtn;
  const startRect = sourceEl.getBoundingClientRect();
  const endRect = targetEl.getBoundingClientRect();
  const dot = document.createElement("span");
  dot.className = "floating-add-dot";
  dot.style.left = `${startRect.left + startRect.width / 2 - 6}px`;
  dot.style.top = `${startRect.top + startRect.height / 2 - 6}px`;
  document.body.appendChild(dot);
  window.requestAnimationFrame(() => {
    const dx = endRect.left + endRect.width / 2 - (startRect.left + startRect.width / 2);
    const dy = endRect.top + endRect.height / 2 - (startRect.top + startRect.height / 2);
    dot.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.35)`;
    dot.style.opacity = "0";
  });
  dot.addEventListener("transitionend", () => dot.remove(), { once: true });
  window.setTimeout(() => { if (dot.parentNode) dot.remove(); }, 460);
}

    title.textContent = item.name;
    titleBtn.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "bento-desc";
    desc.textContent = item.shortDesc;
    topBlock.append(headLine, titleBtn, desc);

    const bottomBlock = document.createElement("div");
    bottomBlock.className = "bento-card-footer";
    const price = document.createElement("span");
    price.className = "bento-price";
    price.textContent = formatSyp(item.price);

    const stepper = document.createElement("div");
    stepper.className = "card-stepper card-stepper--block";

    const minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.className = "card-stepper-btn card-stepper-btn--minus";
    minusBtn.disabled = itemQty <= 0;
    minusBtn.textContent = "−";
    minusBtn.addEventListener("click", () => {
      cart = decrementItemFromCart(cart, item.id, defaultKey);
      renderCart();
      syncAllCardSteppers(item.id);
    });

    const countSpan = document.createElement("span");
    countSpan.className = "card-stepper-count";
    countSpan.textContent = String(itemQty);

    const plusBtn = document.createElement("button");
    plusBtn.type = "button";
    plusBtn.className = "card-stepper-btn card-stepper-btn--plus";
    plusBtn.disabled = !item.available;
    plusBtn.textContent = "+";
    plusBtn.addEventListener("click", () => handleAddCartItem(item, defaultOpt, plusBtn, true));

    stepper.append(minusBtn, countSpan, plusBtn);
    bottomBlock.append(price, stepper);
    body.append(topBlock, bottomBlock);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

function handleAddCartItem(item, optionLabel, sourceEl = null, skipToast = false) {
  const key = `${item.id}|${optionLabel || ""}`;
  cart = addToCart(cart, {
    key,
    id: item.id,
    name: item.name,
    optionLabel: optionLabel || "",
    unitPrice: item.price,
    imageUrl: item.imageUrl || ""
  });
  renderCart();
  syncAllCardSteppers(item.id);
  spawnAddParticle(sourceEl);
  if (!skipToast) showToast(`تمت إضافة «${item.name}» للسلة`, true);
}

function openItemModal(item) {
  modalItem = item;
  modalSelectedOption = item.options && item.options.length > 0 ? item.options[0] : "";
  $("item-modal-cat").textContent = getCategoryName(item.categoryId);
  $("item-modal-title").textContent = item.name;
  $("item-modal-desc").textContent = item.shortDesc;
  $("item-modal-price").textContent = formatSyp(item.price);
  const img = $("item-modal-img");
  if (item.imageUrl) {
    img.src = item.imageUrl;
    img.alt = item.name;
    img.classList.remove("is-hidden");
  } else {
    img.classList.add("is-hidden");
  }
  const optionsWrap = $("item-modal-options-wrap");
  const optionsBox = $("item-modal-options");
  optionsBox.innerHTML = "";
  if (item.options && item.options.length > 0) {
    optionsWrap.classList.remove("is-hidden");
    item.options.forEach((opt) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = `option-chip-btn ${modalSelectedOption === opt ? "is-active" : ""}`;
      chip.textContent = opt;
      chip.addEventListener("click", () => {
        modalSelectedOption = opt;
        Array.from(optionsBox.children).forEach((el) => el.classList.remove("is-active"));
        chip.classList.add("is-active");
      });
      optionsBox.appendChild(chip);
    });
  } else {
    optionsWrap.classList.add("is-hidden");
  }
  const modalAddBtn = $("item-modal-add-btn");
  modalAddBtn.disabled = !item.available;
  modalAddBtn.textContent = item.available ? `إضافة للسلة (${formatSyp(item.price)})` : "غير متوفر حالياً";
  $("item-modal").classList.remove("is-hidden");
}

function closeItemModal() {
  $("item-modal").classList.add("is-hidden");
  modalItem = null;
}

function updateWhatsAppHref() {
  const payload = {
    cafeName: state.settings.cafeName,
    cart,
    customerName: $("cart-customer-name").value,
    tableOrAddress: $("cart-table-address").value,
    note: $("cart-note").value
  };
  $("whatsapp-send-link").href = buildWhatsAppOrderUrl(state.settings.whatsappNumber, payload);
}

function renderCart() {
  const { totalCount, totalAmount } = calculateCartTotals(cart);
  const desktopBtn = $("desktop-cart-btn");
  const mobileBtn = $("mobile-open-cart-btn");
  const desktopCount = $("desktop-cart-count");
  if (desktopCount) desktopCount.textContent = `(${totalCount})`;
  if (desktopBtn) desktopBtn.classList.toggle("has-items", totalCount > 0);
  if (mobileBtn) mobileBtn.classList.toggle("has-items", totalCount > 0);
  $("mobile-cart-label").textContent = `السلة (${totalCount})`;

  const itemsContainer = $("cart-items-container");
  const customerFields = $("cart-customer-fields");
  const footer = $("cart-drawer-footer");
  const clearBtn = $("clear-cart-btn");
  const clearConfirm = $("cart-clear-confirm");
  itemsContainer.innerHTML = "";

  if (cart.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "السلة فارغة حالياً. أضف مشروباً أو مخبوزاً من المينيو لإرساله عبر واتساب.";
    itemsContainer.appendChild(empty);
    customerFields.classList.add("is-hidden");
    footer.classList.add("is-hidden");
    if (clearBtn) clearBtn.classList.add("is-hidden");
    if (clearConfirm) clearConfirm.classList.add("is-hidden");
    syncAllCardSteppers();
    return;
  }

  customerFields.classList.remove("is-hidden");
  footer.classList.remove("is-hidden");
  if (clearBtn) clearBtn.classList.remove("is-hidden");

  cart.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "cart-item";

    const top = document.createElement("div");
    top.className = "cart-item-top";

    const lead = document.createElement("div");
    lead.className = "cart-item-lead";
    const matchedItem = state.items.find((i) => i.id === entry.id);
    const thumbUrl = entry.imageUrl || (matchedItem && matchedItem.imageUrl) || "";
    const thumbBox = document.createElement("div");
    thumbBox.className = "cart-item-thumb-wrap";
    if (thumbUrl) {
      const thumbImg = document.createElement("img");
      thumbImg.className = "cart-item-thumb";
      thumbImg.src = thumbUrl;
      thumbImg.alt = entry.name;
      thumbImg.referrerPolicy = "no-referrer";
      thumbBox.appendChild(thumbImg);
    } else {
      const fb = document.createElement("span");
      fb.className = "cart-item-thumb-fallback";
      fb.textContent = (entry.name || "M").slice(0, 1);
      thumbBox.appendChild(fb);
    }

    const info = document.createElement("div");
    info.className = "cart-item-info";
    const nameEl = document.createElement("strong");
    nameEl.textContent = entry.name;
    info.appendChild(nameEl);
    if (entry.optionLabel) {
      const optEl = document.createElement("p");
      optEl.className = "bento-meta";
      optEl.textContent = `التخصيص: ${entry.optionLabel}`;
      info.appendChild(optEl);
    }
    lead.append(thumbBox, info);

    const linePrice = document.createElement("span");
    linePrice.className = "bento-price";
    linePrice.textContent = formatSyp(entry.unitPrice * entry.quantity);
    top.append(lead, linePrice);

    const controls = document.createElement("div");
    controls.className = "bento-actions";
    const stepper = document.createElement("div");
    stepper.className = "qty-stepper";

    const incBtn = document.createElement("button");
    incBtn.type = "button";
    incBtn.textContent = "+";
    incBtn.addEventListener("click", () => {
      cart = updateCartQuantity(cart, entry.key, 1);
      renderCart();
    });

    const qtySpan = document.createElement("span");
    qtySpan.textContent = String(entry.quantity);

    const decBtn = document.createElement("button");
    decBtn.type = "button";
    decBtn.textContent = "−";
    decBtn.addEventListener("click", () => {
      cart = updateCartQuantity(cart, entry.key, -1);
      renderCart();
    });

    stepper.append(incBtn, qtySpan, decBtn);

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "btn-small btn-danger";
    removeBtn.textContent = "حذف";
    removeBtn.addEventListener("click", () => {
      cart = updateCartQuantity(cart, entry.key, -entry.quantity);
      renderCart();
    });

    controls.append(stepper, removeBtn);
    row.append(top, controls);
    itemsContainer.appendChild(row);
  });

  $("cart-grand-total").textContent = formatSyp(totalAmount);
  updateWhatsAppHref();
  syncAllCardSteppers();
}

function openCartDrawer() {
  if ($("cart-clear-confirm")) $("cart-clear-confirm").classList.add("is-hidden");
  $("cart-drawer").classList.remove("is-hidden");
}

function closeCartDrawer() {
  if ($("cart-clear-confirm")) $("cart-clear-confirm").classList.add("is-hidden");
  $("cart-drawer").classList.add("is-hidden");
}

function renderAll() {
  renderSettings();
  renderCategoryTabs();
  renderBentoGrid();
  renderCart();
}

function bindEvents() {
  const searchInput = $("menu-search-input");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderBentoGrid();
    });
  }

  $("item-modal-close").addEventListener("click", closeItemModal);
  $("item-modal").addEventListener("click", (e) => {
    if (e.target === $("item-modal")) closeItemModal();
  });
  $("item-modal-add-btn").addEventListener("click", () => {
    if (modalItem) {
      handleAddCartItem(modalItem, modalSelectedOption, $("item-modal-add-btn"));
      closeItemModal();
    }
  });

  if ($("desktop-cart-btn")) $("desktop-cart-btn").addEventListener("click", openCartDrawer);
  $("mobile-open-cart-btn").addEventListener("click", openCartDrawer);
  $("toast-action-btn").addEventListener("click", openCartDrawer);
  $("cart-drawer-close").addEventListener("click", closeCartDrawer);
  $("cart-drawer").addEventListener("click", (e) => {
    if (e.target === $("cart-drawer")) closeCartDrawer();
  });

  if ($("clear-cart-btn")) {
    $("clear-cart-btn").addEventListener("click", () => {
      if (cart.length > 0) $("cart-clear-confirm").classList.remove("is-hidden");
    });
  }
  if ($("cancel-clear-cart-btn")) {
    $("cancel-clear-cart-btn").addEventListener("click", () => $("cart-clear-confirm").classList.add("is-hidden"));
  }
  if ($("confirm-clear-cart-btn")) {
    $("confirm-clear-cart-btn").addEventListener("click", () => {
      cart = [];
      $("cart-clear-confirm").classList.add("is-hidden");
      renderCart();
      showToast("تم مسح جميع العناصر من السلة");
    });
  }

  ["cart-customer-name", "cart-table-address", "cart-note"].forEach((id) => {
    $(id).addEventListener("input", updateWhatsAppHref);
  });

  $("copy-order-btn").addEventListener("click", async () => {
    const text = buildWhatsAppOrderText({
      cafeName: state.settings.cafeName,
      cart,
      customerName: $("cart-customer-name").value,
      tableOrAddress: $("cart-table-address").value,
      note: $("cart-note").value
    });
    try {
      await navigator.clipboard.writeText(text);
      showToast("تم نسخ نص الطلب بنجاح");
    } catch {
      showToast("يمكنك إرسال الطلب مباشرة عبر زر واتساب");
    }
  });

  window.addEventListener("storage", () => {
    state = LocalMenuAdapter.loadState();
    renderAll();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeItemModal();
      closeCartDrawer();
    }
  });

  const themeToggleBtn = $("theme-toggle-btn");
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "light" ? "dark" : "light");
    });
  }
}

initTheme();
bindEvents();
renderAll();

// تفعيل المزامنة الفورية onSnapshot: أي تعديل في الإدارة ينعكس هنا فوراً
subscribeToFirebaseMenu(
  (firestoreState) => {
    state = firestoreState;
    renderAll();
    const statusEl = $("live-sync-status");
    if (statusEl) {
      statusEl.innerHTML = `<span style="color: #2a856b;">●</span> <span>محدّث لحظياً</span>`;
    }
  },
  (err) => {
    console.warn("Firebase menu subscription:", err);
  }
);
